<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD6h1jN0RgXBbIqrjri9gSPUZbymFfPtLo",
    authDomain: "sg-courier.firebaseapp.com",
    projectId: "sg-courier",
    storageBucket: "sg-courier.firebasestorage.app",
    messagingSenderId: "718910401322",
    appId: "1:718910401322:web:6ff7a20babca071baa4c53",
    measurementId: "G-KXQGW871V3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const form = document.getElementById("courierForm");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = "Sending request…";

    try {
      await addDoc(collection(db, "deliveryRequests"), {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        pickupAddress: document.getElementById("pickup").value.trim(),
        deliveryAddress: document.getElementById("delivery").value.trim(),
        parcelType: document.getElementById("parcel").value,
        weightKg: document.getElementById("weight").value
          ? Number(document.getElementById("weight").value)
          : null,
        notes: document.getElementById("notes").value.trim(),
        status: "new",
        createdAt: serverTimestamp()
      });

      alert("Your delivery request was sent to SG Courier.");
      form.reset();
    } catch (error) {
      console.error("Request submission failed:", error);
      alert("The request could not be saved. Please send me a screenshot of this error.");
    } finally {
      button.disabled = false;
      button.textContent = "Send Delivery Request";
    }
  });
</script>
