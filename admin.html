<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Courier Admin</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 18px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 26px; margin-bottom: 5px; }
    header p { color: #d1d5db; }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 { margin-bottom: 15px; font-size: 20px; }

    .status {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .stat-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
    }

    .stat-box strong {
      display: block;
      font-size: 26px;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    th { background: #f9fafb; }
    .empty { text-align: center; color: #6b7280; padding: 30px; }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    #signOutButton {
      width: auto;
      margin: 0;
      padding: 10px 14px;
    }

    #loginMessage { margin-top: 12px; color: #b91c1c; }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      table { font-size: 14px; }
      th, td { padding: 8px; }
      .header-inner { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>SG Courier Admin</h1>
        <p>Administration Dashboard</p>
      </div>
      <button id="signOutButton" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <section class="card" id="loginPanel">
      <h2>Admin sign in</h2>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMessage"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="status">✓ Signed in to SG Courier Admin</div>

      <div class="card">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat-box">Customer Requests<strong>0</strong></div>
          <div class="stat-box">Active Deliveries<strong>0</strong></div>
          <div class="stat-box">Completed<strong>0</strong></div>
        </div>
      </div>

      <div class="card">
        <h2>Customer Requests</h2>
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Pickup</th>
              <th>Destination</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" class="empty">No customer requests yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>SG Courier Admin</footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6h1jN0RgXBbIqrjri9gSPUZbymFfPtLo",
      authDomain: "sg-courier.firebaseapp.com",
      projectId: "sg-courier",
      storageBucket: "sg-courier.firebasestorage.app",
      messagingSenderId: "718910401322",
      appId: "1:718910401322:web:6ff7a20babca071baa4c53",
      measurementId: "G-KXQGW871V3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const signOutButton = document.getElementById("signOutButton");

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "Signing in…";

      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        loginMessage.textContent = "";
      } catch (error) {
        loginMessage.textContent = "Sign-in failed. Check the email and password.";
        console.error(error);
      }
    });

    auth.onAuthStateChanged((user) => {
      loginPanel.hidden = Boolean(user);
      dashboard.hidden = !user;
      signOutButton.hidden = !user;
    });

    signOutButton.addEventListener("click", () => auth.signOut());
  </script>
</body>
</html>
