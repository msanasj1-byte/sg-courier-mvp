<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Courier Admin</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 18px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 26px; margin-bottom: 5px; }
    header p { color: #d1d5db; }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 { margin-bottom: 15px; font-size: 20px; }

    .status {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .stat-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
    }

    .stat-box strong {
      display: block;
      font-size: 26px;
      margin-top: 8px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      min-width: 920px;
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    th { background: #f9fafb; }
    .empty { text-align: center; color: #6b7280; padding: 30px; }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    #signOutButton {
      width: auto;
      margin: 0;
      padding: 10px 14px;
    }

    #loginMessage { margin-top: 12px; color: #b91c1c; }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      table { font-size: 14px; }
      th, td { padding: 8px; }
      .header-inner { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>SG Courier Admin</h1>
        <p>Administration Dashboard</p>
      </div>
      <button id="signOutButton" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <section class="card" id="loginPanel">
      <h2>Admin sign in</h2>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMessage"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="status" id="dashboardStatus">✓ Signed in to SG Courier Admin</div>

      <div class="card">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat-box">Customer Requests<strong id="requestCount">0</strong></div>
          <div class="stat-box">Active Deliveries<strong id="activeCount">0</strong></div>
          <div class="stat-box">Completed<strong id="completedCount">0</strong></div>
        </div>
      </div>

      <div class="card">
        <h2>Customer Requests</h2>
        <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Pickup</th>
              <th>Destination</th>
              <th>Parcel weight</th>
              <th>Distance</th>
              <th>Status</th>
              <th>Quote</th>
            </tr>
          </thead>
          <tbody id="requestsTableBody">
            <tr><td colspan="5" class="empty">Loading customer requests…</td></tr>
          </tbody>
        </table>
        </div>
      </div>
    </section>
  </main>

  <footer>SG Courier Admin</footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6h1jN0RgXBbIqrjri9gSPUZbymFfPtLo",
      authDomain: "sg-courier.firebaseapp.com",
      projectId: "sg-courier",
      storageBucket: "sg-courier.firebasestorage.app",
      messagingSenderId: "718910401322",
      appId: "1:718910401322:web:6ff7a20babca071baa4c53",
      measurementId: "G-KXQGW871V3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const signOutButton = document.getElementById("signOutButton");
    const dashboardStatus = document.getElementById("dashboardStatus");
    const requestsTableBody = document.getElementById("requestsTableBody");
    let unsubscribeRequests = null;

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "Signing in…";
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        loginMessage.textContent = "";
      } catch (error) {
        loginMessage.textContent = "Sign-in failed. Check the email and password.";
        console.error("Admin sign-in failed:", error);
      }
    });

    function appendCell(row, value) {
      const cell = document.createElement("td");
      cell.textContent = value || "—";
      row.appendChild(cell);
    }

    function firstValue(request, keys) {
      for (const key of keys) {
        const value = key.includes(".")
          ? key.split(".").reduce((object, part) => object && object[part], request)
          : request[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") return value;
      }
      return "";
    }

    function requestAddresses(request) {
      return {
        pickup: String(firstValue(request, [
          "pickupAddress", "pickup", "pickupLocation", "pickup_address",
          "fromAddress", "collectionAddress", "collectionLocation"
        ])).trim(),
        destination: String(firstValue(request, [
          "deliveryAddress", "destination", "dropoffAddress", "dropoff",
          "deliveryLocation", "delivery_address", "toAddress", "destinationAddress"
        ])).trim()
      };
    }

    function requestWeight(request) {
      const raw = firstValue(request, [
        "weightKg", "parcelWeightKg", "weight_kg", "parcel_weight_kg",
        "parcelWeight", "weight", "packageWeight", "parcel.weightKg",
        "parcel.weight", "parcelDetails.weightKg"
      ]);
      if (raw === "") return { raw: "", kg: null, label: "Not provided" };

      const label = typeof raw === "number" ? raw + " kg" : String(raw).trim();
      const range = label.match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/);
      const numeric = range ? Number(range[2]) : Number.parseFloat(label);
      if (!Number.isFinite(numeric) || numeric < 0) return { raw, kg: null, label };
      return { raw, kg: numeric, label: /kg/i.test(label) ? label : label + " kg" };
    }

    function requestDistance(request) {
      const raw = firstValue(request, [
        "distanceKm", "routeDistanceKm", "distance_km", "estimatedDistanceKm",
        "route.distanceKm", "distance"
      ]);
      if (raw === "") return "Not recorded";
      const match = String(raw).match(/\d+(?:\.\d+)?/);
      if (!match) return String(raw).trim();
      const km = Number(match[0]);
      return Number.isFinite(km) ? km.toFixed(1) + " km" : "Not recorded";
    }

    function suggestedPrice(request) {
      const addresses = requestAddresses(request);
      const pickup = addresses.pickup.toLowerCase();
      const destination = addresses.destination.toLowerCase();
      const weight = requestWeight(request);

      let prices = null;
      let routeLabel = "";
      if (pickup.includes("soshanguve") && destination.includes("soshanguve")) {
        prices = [55, 65, 80, 110];
        routeLabel = "Soshanguve → Soshanguve";
      } else if (pickup.includes("soshanguve") && destination.includes("mabopane")) {
        prices = [70, 80, 100, 130];
        routeLabel = "Soshanguve → Mabopane";
      }

      if (weight.kg === null) {
        return { amount: null, tier: "", route: routeLabel,
          reason: "Weight was not saved with this request. Enter a quote manually and check the customer form's weight field." };
      }
      if (!prices) return { amount: null, tier: "", route: routeLabel,
        reason: "Manual quote: no saved price for this route." };
      if (weight.kg <= 0) return { amount: null, tier: "", route: routeLabel,
        reason: "Enter a parcel weight above 0 kg to get a price suggestion." };
      if (weight.kg <= 2) return { amount: prices[0], tier: "0–2 kg", route: routeLabel };
      if (weight.kg <= 5) return { amount: prices[1], tier: "over 2–5 kg", route: routeLabel };
      if (weight.kg <= 10) return { amount: prices[2], tier: "over 5–10 kg", route: routeLabel };
      if (weight.kg <= 20) return { amount: prices[3], tier: "over 10–20 kg", route: routeLabel };
      return { amount: null, tier: "", route: routeLabel,
        reason: "Manual quote: parcel is over 20 kg." };
    }

    function makeQuoteCell(request) {
      const cell = document.createElement("td");
      const suggestion = suggestedPrice(request);
      const savedQuote = Number(request.quoteAmount);
      const amount = Number.isFinite(savedQuote) && savedQuote > 0 ? savedQuote : suggestion.amount;
      const weight = requestWeight(request);
      const weightLine = document.createElement("div");
      weightLine.style.fontSize = "13px";
      weightLine.style.marginBottom = "6px";
      weightLine.textContent = "Parcel weight: " + weight.label;
      cell.appendChild(weightLine);

      const hint = document.createElement("div");
      hint.style.fontSize = "12px";
      hint.style.marginBottom = "6px";
      hint.textContent = suggestion.amount !== null
        ? "Suggested: R" + suggestion.amount.toFixed(2) + " (" + suggestion.tier + ")"
        : suggestion.reason;
      cell.appendChild(hint);

      const input = document.createElement("input");
      input.type = "number";
      input.min = "1";
      input.step = "0.01";
      input.placeholder = "Enter quote (R)";
      input.setAttribute("aria-label", "Quote amount for " + (request.name || "customer"));
      if (amount !== null) input.value = amount.toFixed(2);
      cell.appendChild(input);

      const note = document.createElement("div");
      note.style.fontSize = "12px";
      note.style.marginTop = "6px";
      note.textContent = request.quoteStatus === "approved" && Number.isFinite(savedQuote)
        ? "Approved: R" + savedQuote.toFixed(2)
        : "";
      cell.appendChild(note);

      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Approve & open WhatsApp";
      button.style.minWidth = "185px";
      button.addEventListener("click", async () => {
        const quote = Number(input.value);
        if (!Number.isFinite(quote) || quote <= 0) {
          note.textContent = "Enter a valid quote amount first.";
          return;
        }

        let phone = String(request.phone || request.customerPhone || "").replace(/\D/g, "");
        if (phone.startsWith("0")) phone = "27" + phone.slice(1);
        if (phone.length < 9) {
          note.textContent = "This request has no valid phone number.";
          return;
        }

        const addresses = requestAddresses(request);
        const message =
          "Hello " + (request.name || request.customerName || "Customer") +
          ", SG Courier's delivery quote is R" + quote.toFixed(2) +
          " for delivery from " + (addresses.pickup || "your pickup address") +
          " to " + (addresses.destination || "your delivery address") +
          ". Please reply here to accept or discuss this quote.";
        const whatsappUrl = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
        const whatsappTab = window.open("about:blank", "_blank");
        button.disabled = true;
        note.textContent = "Saving approved quote…";

        try {
          await db.collection("deliveryRequests").doc(request.id).update({
            quoteAmount: quote,
            quoteCurrency: "ZAR",
            quoteStatus: "approved",
            quoteApprovedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          if (whatsappTab) whatsappTab.location.href = whatsappUrl;
          else window.location.href = whatsappUrl;
          note.textContent = "Quote approved. Review the message and tap Send in WhatsApp.";
        } catch (error) {
          if (whatsappTab) whatsappTab.close();
          console.error("Could not save approved quote:", error);
          note.textContent = "Could not save quote. Check Firestore rules and try again.";
        } finally {
          button.disabled = false;
        }
      });
      cell.appendChild(button);
      return cell;
    }

    function renderRequests(snapshot) {
      const requests = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      requests.sort((a, b) => {
        const aTime = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const bTime = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return bTime - aTime;
      });

      const activeStatuses = [
        "assigned", "accepted", "picked up", "picked-up", "in transit",
        "in-transit", "out for delivery", "out-for-delivery"
      ];
      const completedStatuses = ["completed", "delivered"];
      const active = requests.filter((request) =>
        activeStatuses.includes(String(request.status || "").toLowerCase())
      ).length;
      const completed = requests.filter((request) =>
        completedStatuses.includes(String(request.status || "").toLowerCase())
      ).length;

      document.getElementById("requestCount").textContent = requests.length;
      document.getElementById("activeCount").textContent = active;
      document.getElementById("completedCount").textContent = completed;
      requestsTableBody.replaceChildren();

      if (requests.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 7;
        cell.className = "empty";
        cell.textContent = "No customer requests yet.";
        row.appendChild(cell);
        requestsTableBody.appendChild(row);
        return;
      }

      requests.forEach((request) => {
        const row = document.createElement("tr");
        const customer = document.createElement("td");
        const name = document.createElement("strong");
        name.textContent = request.name || "Customer";
        customer.appendChild(name);
        if (request.phone) {
          customer.appendChild(document.createElement("br"));
          customer.appendChild(document.createTextNode(request.phone));
        }
        row.appendChild(customer);
        const addresses = requestAddresses(request);
        appendCell(row, addresses.pickup);
        appendCell(row, addresses.destination);
        appendCell(row, requestWeight(request).label);
        appendCell(row, requestDistance(request));
        appendCell(row, request.status || "new");
        row.appendChild(makeQuoteCell(request));
        requestsTableBody.appendChild(row);
      });
    }

    function watchRequests() {
      if (unsubscribeRequests) unsubscribeRequests();
      dashboardStatus.textContent = "✓ Signed in. Loading customer requests…";
      dashboardStatus.classList.remove("error");

      unsubscribeRequests = db.collection("deliveryRequests").onSnapshot(
        (snapshot) => {
          dashboardStatus.textContent = "✓ Signed in to SG Courier Admin";
          dashboardStatus.classList.remove("error");
          renderRequests(snapshot);
        },
        (error) => {
          console.error("Could not read deliveryRequests:", error);
          dashboardStatus.textContent =
            "Signed in, but requests could not be loaded. Check Firestore rules and the deliveryRequests collection.";
          dashboardStatus.classList.add("error");
          requestsTableBody.replaceChildren();
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 7;
          cell.className = "empty";
          cell.textContent = "Could not load requests. Please check the Firestore rules.";
          row.appendChild(cell);
          requestsTableBody.appendChild(row);
        }
      );
    }

    auth.onAuthStateChanged((user) => {
      loginPanel.hidden = Boolean(user);
      dashboard.hidden = !user;
      signOutButton.hidden = !user;
      if (user) {
        watchRequests();
      } else if (unsubscribeRequests) {
        unsubscribeRequests();
        unsubscribeRequests = null;
      }
    });

    signOutButton.addEventListener("click", () => auth.signOut());
  </script>
</body>
</html>
